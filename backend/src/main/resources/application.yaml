spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

server:
  shutdown: graceful

app:
  storage:
    resume-directory: ${RESUME_STORAGE_PATH:./data/resumes}
  resumes:
    max-file-size-bytes: 10485760
  jobs:
    collection:
      scheduling-enabled: false
      initial-delay: PT30S
      fixed-delay: PT6H
